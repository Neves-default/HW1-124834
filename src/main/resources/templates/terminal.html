<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Locker terminal - TuttiBox')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="|Locker terminal - ${station.name()}|">Locker terminal</h1>

    <p data-testid="terminal-message" role="status" th:if="${message}"
       th:class="${ok} ? 'msg ok' : 'msg error'" th:text="${message}">Message</p>

    <div class="terminal">
        <section class="panel" aria-labelledby="dropoff-title">
            <h2 id="dropoff-title">Courier drop-off</h2>
            <form method="post" th:action="@{/terminal/{id}/drop-off(id=${station.id()})}">
                <label for="trackingCode">Tracking code</label>
                <input id="trackingCode" name="trackingCode" type="text" required autocomplete="off">
                <button type="submit">Open compartment for drop-off</button>
            </form>
        </section>

        <section class="panel" aria-labelledby="pickup-title">
            <h2 id="pickup-title">Recipient pickup</h2>
            <form method="post" th:action="@{/terminal/{id}/pickup(id=${station.id()})}">
                <label for="pickupCode">Pickup code</label>
                <input id="pickupCode" name="pickupCode" type="text" inputmode="numeric" required autocomplete="off">
                <button type="submit">Collect parcel</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>

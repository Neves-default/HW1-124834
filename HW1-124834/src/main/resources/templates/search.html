<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Find a locker - TuttiBox')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>Find a locker</h1>
    <p class="lead">Type your address to see the five nearest stations and how many compartments are free.</p>

    <form class="card" method="get" th:action="@{/search}">
        <label for="address">Address</label>
        <div class="form-row">
            <input id="address" name="address" type="text" th:value="${address}" required autocomplete="street-address"
                   placeholder="e.g. Rua de Aveiro 10, Aveiro">
            <button type="submit">Search</button>
        </div>
    </form>

    <p class="msg error" role="alert" data-testid="search-error" th:if="${error}" th:text="${error}">Error</p>

    <section th:if="${results != null and !results.isEmpty()}" aria-labelledby="results-title">
        <h2 id="results-title">Nearest stations</h2>
        <ol class="results" data-testid="results" style="list-style: none; padding: 0; margin: 0;">
            <li class="card result" th:each="s, it : ${results}" data-testid="station-row">
                <span class="rank" aria-hidden="true" th:text="${it.count}">1</span>
                <div>
                    <div class="name" th:text="${s.name()}">Station</div>
                    <div class="addr" th:text="${s.address()}">Address</div>
                </div>
                <span class="distance" th:text="|${#numbers.formatDecimal(s.distanceKm(), 1, 2)} km|">0.00 km</span>
                <div class="sizes">
                    <span th:class="${s.freeS() > 0} ? 'size' : 'size none'" th:text="|Small: ${s.freeS()} free|">Small</span>
                    <span th:class="${s.freeM() > 0} ? 'size' : 'size none'" th:text="|Medium: ${s.freeM()} free|">Medium</span>
                    <span th:class="${s.freeL() > 0} ? 'size' : 'size none'" th:text="|Large: ${s.freeL()} free|">Large</span>
                </div>
            </li>
        </ol>
    </section>

    <p class="attribution">Address search by Nominatim. Map data
        <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>.</p>
</main>
</body>
</html>

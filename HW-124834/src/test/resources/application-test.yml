# Integration tests: PostgreSQL in a throw-away container started by Testcontainers through the JDBC URL.
spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///tuttibox
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create

tuttibox:
  seed-demo-data: false
  pickup-code:
    secret: test-secret
  geocoding:
    provider: "off"          # replaced by the FakeGeocoder test double; the real API is never called
  scheduler:
    deadline-check-ms: 86400000   # tests trigger the deadline check themselves

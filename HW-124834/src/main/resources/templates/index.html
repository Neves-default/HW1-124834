<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('TuttiBox')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>TuttiBox parcel lockers</h1>
    <p>Choose a locker station instead of a home address and collect your parcel whenever it suits you.</p>
    <ul>
        <li><a th:href="@{/search}">Find a locker near you</a></li>
        <li><a th:href="@{/track}">Track a parcel</a></li>
    </ul>

    <h2>Stations</h2>
    <table>
        <caption>Locker stations, their terminal and operator pages</caption>
        <thead>
        <tr><th scope="col">Station</th><th scope="col">Address</th><th scope="col">Terminal</th><th scope="col">Operator</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${stations}">
            <td th:text="${s.name()}">Station</td>
            <td th:text="${s.address()}">Address</td>
            <td><a th:href="@{/terminal/{id}(id=${s.id()})}" th:text="|Terminal at ${s.name()}|">Terminal</a></td>
            <td><a th:href="@{/operator/{id}(id=${s.id()})}" th:text="|Operator page for ${s.name()}|">Operator</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>

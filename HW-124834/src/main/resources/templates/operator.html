<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Operator - TuttiBox')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="|Operator - ${station.name()}|">Operator</h1>

    <p data-testid="operator-message" role="status" th:if="${message}"
       th:class="${ok} ? 'msg ok' : 'msg error'" th:text="${message}">Message</p>

    <h2>Parcels</h2>
    <form method="get" th:action="@{/operator/{id}(id=${station.id()})}">
        <label for="state">Filter by state</label>
        <select id="state" name="state">
            <option value="">All states</option>
            <option th:each="s : ${states}" th:value="${s}" th:text="${s}" th:selected="${s == selectedState}">STATE</option>
        </select>
        <button type="submit">Filter</button>
    </form>

    <table data-testid="parcels">
        <caption>Parcels at this station</caption>
        <thead>
        <tr><th scope="col">Tracking code</th><th scope="col">State</th><th scope="col">Size</th><th scope="col">Compartment</th><th scope="col">Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${parcels}">
            <td th:text="${p.trackingCode()}">code</td>
            <td th:text="${p.state()}">state</td>
            <td th:text="${p.size()}">size</td>
            <td th:text="${p.compartmentCode()} ?: '-'">compartment</td>
            <td>
                <form class="inline" method="post" th:if="${p.state().name() == 'EXPIRED'}"
                      th:action="@{/operator/{id}/parcels/{code}/removal(id=${station.id()},code=${p.trackingCode()})}">
                    <button type="submit" th:text="|Register removal of ${p.trackingCode()}|">Register removal</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Compartments</h2>
    <table data-testid="compartments">
        <caption>Compartments of this station</caption>
        <thead>
        <tr><th scope="col">Code</th><th scope="col">Size</th><th scope="col">State</th><th scope="col">Needs attention</th><th scope="col">Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${compartments}">
            <td th:text="${c.code()}">code</td>
            <td th:text="${c.size()}">size</td>
            <td th:text="${c.state()}">state</td>
            <td th:text="${c.needsAttention()} ? 'Yes' : 'No'">No</td>
            <td>
                <form class="inline" method="post" th:if="${c.state().name() == 'FREE'}"
                      th:action="@{/operator/{id}/compartments/{cid}/out-of-service(id=${station.id()},cid=${c.id()})}">
                    <button type="submit" class="secondary" th:text="|Put ${c.code()} out of service|">Out of service</button>
                </form>
                <form class="inline" method="post" th:if="${c.state().name() == 'OUT_OF_SERVICE'}"
                      th:action="@{/operator/{id}/compartments/{cid}/reactivation(id=${station.id()},cid=${c.id()})}">
                    <button type="submit" th:text="|Reactivate ${c.code()}|">Reactivate</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Track a parcel - TuttiBox')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>Track a parcel</h1>
    <form method="get" th:action="@{/track}">
        <label for="code">Tracking code</label>
        <input id="code" name="code" type="text" th:value="${code}" required>
        <button type="submit">Track</button>
    </form>

    <p class="msg error" role="alert" data-testid="track-error" th:if="${error}" th:text="${error}">Error</p>

    <section th:if="${parcel}" data-testid="tracking">
        <h2 th:text="|Parcel ${parcel.trackingCode()}|">Parcel</h2>
        <p>Current state: <strong data-testid="tracking-state" th:text="${parcel.state()}">STATE</strong></p>
        <p>Station: <span th:text="${parcel.stationName()}">Station</span></p>
        <table>
            <caption>History</caption>
            <thead><tr><th scope="col">When (UTC)</th><th scope="col">From</th><th scope="col">To</th><th scope="col">By</th></tr></thead>
            <tbody>
            <tr th:each="t : ${parcel.history()}">
                <td th:text="${t.at()}">time</td>
                <td th:text="${t.from()} ?: '-'">from</td>
                <td th:text="${t.to()}">to</td>
                <td th:text="${t.actor()}">actor</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
